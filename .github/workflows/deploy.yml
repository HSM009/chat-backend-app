name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest code
        shell: bash
        run: |
          set -e

          DEPLOY_DIR="/home/hsm/chatting-app/deployments/chat-backend-app"
          COMPOSE_DIR="/home/hsm/chatting-app/deployments"

          echo "================================="
          echo "Starting backend deployment"
          echo "================================="

          cd "$DEPLOY_DIR"

          echo "Fetching latest code..."
          git fetch origin main

          echo "Updating working tree..."
          git reset --hard origin/main

          echo "Building backend..."
          cd "$COMPOSE_DIR"
          docker compose build backend

          echo "Starting backend..."
          docker compose up -d backend

          echo "Checking backend..."
          docker ps --filter "name=chat-backend"

          echo "================================="
          echo "Deployment completed"
          echo "================================="
