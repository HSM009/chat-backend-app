name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        run: |
          set -eux

          DEPLOY_DIR="/workspace/deployments/chat-backend-app"
          COMPOSE_DIR="/workspace/deployments"

          echo "================================="
          echo "Starting backend deployment"
          echo "================================="

          echo "Deployment directory:"
          ls -la "$DEPLOY_DIR"

          echo "Fetching latest code..."
          cd "$DEPLOY_DIR"
          git fetch origin main

          echo "Updating working tree..."
          git reset --hard origin/main

          echo "Building backend..."
          cd "$COMPOSE_DIR"
          docker compose build backend

          echo "Starting backend..."
          docker compose up -d backend

          echo "Checking backend..."
          docker ps --filter "name=chat-backend"

          echo "Backend logs:"
          docker logs --tail 30 chat-backend

          echo "================================="
          echo "Deployment completed"
          echo "================================="
